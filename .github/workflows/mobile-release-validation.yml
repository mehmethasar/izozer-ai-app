name: Mazdek Release Derleme Doğrulaması

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Kaynak ve güvenlik politikasını doğrula
        run: python3 ci_verify_security.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter platformlarını üret
        working-directory: mobile
        run: flutter create --no-pub --platforms=android,ios --org com.mazdek --project-name mazdek_ai --android-language kotlin .
      - name: Android platform, marka ve alan adı uyumluluklarını uygula
        run: |
          python3 ci_patch.py
          python3 ci_branding_domain.py
      - name: Bağımlılıkları çöz
        working-directory: mobile
        run: flutter pub get
      - name: Android SDK bağımlılık uyumluluğunu uygula
        run: python3 ci_compile_sdk.py
      - name: Release AAB derlemesi
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://api.izozer.com
          --dart-define=APPLE_SERVICE_ID=com.mazdek.mazdekai.service
          --dart-define=APPLE_REDIRECT_URI=https://api.izozer.com/auth/apple/callback
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mazdek-android-release-api-izozer-validation
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios-release-validation:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Kaynak ve güvenlik politikasını doğrula
        run: python3 ci_verify_security.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter platformlarını üret
        working-directory: mobile
        run: flutter create --no-pub --platforms=android,ios --org com.mazdek --project-name mazdek_ai --android-language kotlin .
      - name: iOS platform, marka ve alan adı uyumluluklarını uygula
        run: |
          python3 ci_patch.py
          python3 ci_branding_domain.py
      - name: Bağımlılıkları çöz
        working-directory: mobile
        run: flutter pub get
      - name: İmzasız iOS release cihaz derlemesi
        working-directory: mobile
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://api.izozer.com
          --dart-define=APPLE_SERVICE_ID=com.mazdek.mazdekai.service
          --dart-define=APPLE_REDIRECT_URI=https://api.izozer.com/auth/apple/callback
      - name: iOS release uygulamasını paketle
        run: ditto -c -k --sequesterRsrc --keepParent mobile/build/ios/iphoneos/Runner.app mobile/build/ios/mazdek-ios-release-unsigned.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mazdek-ios-release-api-izozer-unsigned-validation
          path: mobile/build/ios/mazdek-ios-release-unsigned.zip
          if-no-files-found: error
