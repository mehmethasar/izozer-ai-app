name: Mazdek Android iOS Gerçek Derleme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kaynak ve güvenlik politikasını doğrula
        run: python3 ci_verify_security.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter platformlarını üret
        working-directory: mobile
        run: flutter create --no-pub --platforms=android,ios --org com.mazdek --project-name mazdek_ai --android-language kotlin .
      - name: Android platform, marka, sürüm ve alan adı uyumluluklarını uygula
        run: |
          python3 ci_patch.py
          python3 ci_branding_domain.py
          grep -q '^version: 2.1.2+4$' mobile/pubspec.yaml
          grep -q "static const String appName = 'Mazdek'" mobile/lib/core/config/app_config.dart
          grep -q "static const String productionApiUrl = 'https://api.izozer.com'" mobile/lib/core/config/app_config.dart
      - name: Bağımlılıkları çöz
        working-directory: mobile
        run: flutter pub get
      - name: Android SDK bağımlılık uyumluluğunu uygula
        run: python3 ci_compile_sdk.py
      - name: Statik analiz
        working-directory: mobile
        run: flutter analyze
      - name: Birim testleri
        working-directory: mobile
        run: flutter test
      - name: Android kurulabilir test APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://api.izozer.com
          --dart-define=APPLE_SERVICE_ID=com.mazdek.mazdekai.service
          --dart-define=APPLE_REDIRECT_URI=https://api.izozer.com/auth/apple/callback
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mazdek-android-api-izozer-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kaynak ve güvenlik politikasını doğrula
        run: python3 ci_verify_security.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter platformlarını üret
        working-directory: mobile
        run: flutter create --no-pub --platforms=android,ios --org com.mazdek --project-name mazdek_ai --android-language kotlin .
      - name: iOS platform, marka, sürüm ve alan adı uyumluluklarını uygula
        run: |
          python3 ci_patch.py
          python3 ci_branding_domain.py
          grep -q '^version: 2.1.2+4$' mobile/pubspec.yaml
          grep -q "static const String appName = 'Mazdek'" mobile/lib/core/config/app_config.dart
          grep -q "static const String productionApiUrl = 'https://api.izozer.com'" mobile/lib/core/config/app_config.dart
      - name: Bağımlılıkları çöz
        working-directory: mobile
        run: flutter pub get
      - name: Statik analiz
        working-directory: mobile
        run: flutter analyze
      - name: Birim testleri
        working-directory: mobile
        run: flutter test
      - name: iOS Simulator derlemesi
        working-directory: mobile
        run: >-
          flutter build ios --simulator --debug --no-codesign
          --dart-define=API_BASE_URL=https://api.izozer.com
          --dart-define=APPLE_SERVICE_ID=com.mazdek.mazdekai.service
          --dart-define=APPLE_REDIRECT_URI=https://api.izozer.com/auth/apple/callback
      - name: Simulator uygulamasını paketle
        run: ditto -c -k --sequesterRsrc --keepParent mobile/build/ios/iphonesimulator/Runner.app mobile/build/ios/mazdek-ios-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mazdek-ios-api-izozer-simulator
          path: mobile/build/ios/mazdek-ios-simulator.zip
          if-no-files-found: error
