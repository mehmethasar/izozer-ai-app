name: mazdek_ai
publish_to: none
description: Mazdek - yapay zeka destekli işletme, ön muhasebe ve proje yönetimi.
version: 2.1.2+4
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  http: 1.6.0
  flutter_secure_storage: 10.3.1
  shared_preferences: 2.5.3
  path_provider: 2.1.5
  cryptography: 2.7.0
  local_auth: 3.0.2
  sign_in_with_apple: 8.1.0
  file_picker: 10.3.0
  share_plus: 11.1.0
  cross_file: 0.3.4+2
  intl: 0.20.2
  crypto: 3.0.6
  firebase_core: 4.12.1
  firebase_messaging: 16.4.3
  flutter_local_notifications: 22.2.0
  speech_to_text: 7.4.0
  cunning_document_scanner: 2.8.0
  timezone: 0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#D2490F'
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: '#D2490F'
  color_dark: '#141414'
  image: assets/branding/app_icon.png
  image_dark: assets/branding/app_icon.png
  android_12:
    color: '#D2490F'
    color_dark: '#141414'
    image: assets/branding/app_icon.png
    image_dark: assets/branding/app_icon.png
  android: true
  ios: true
  web: false
